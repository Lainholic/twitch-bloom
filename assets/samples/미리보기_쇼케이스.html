<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레트로 픽셀 도트 SVG 샘플 4종</title>
  <style>
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 26px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 35px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1000px;
      width: 100%;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      border-color: #38bdf8;
      box-shadow: 0 15px 35px rgba(56, 189, 248, 0.2);
    }
    .img-wrap {
      width: 140px;
      height: 140px;
      background: #0f172a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 1px dashed rgba(255, 255, 255, 0.12);
    }
    .img-wrap img {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      animation: float 2.5s ease-in-out infinite alternate;
    }
    @keyframes float {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-8px) rotate(4deg); }
    }
    .card:nth-child(2) .img-wrap img { animation-delay: 0.4s; }
    .card:nth-child(3) .img-wrap img { animation-delay: 0.8s; }
    .card:nth-child(4) .img-wrap img { animation-delay: 1.2s; }

    .card-title {
      font-weight: 800;
      font-size: 16px;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 13px;
      color: #38bdf8;
      font-family: monospace;
      margin-bottom: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }
    .info-footer {
      margin-top: 40px;
      padding: 14px 24px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
    .highlight { color: #facc15; font-weight: 700; }
  </style>
</head>
<body>
  <h1>🎨 레트로 픽셀 도트 SVG 아이콘 샘플</h1>
  <p>크레딧 0원! 16x16 crispEdges 벡터 도트 매트릭스 기술로 제작된 고품질 레트로 소품</p>
  
  <div class="grid">
    <div class="card">
      <div class="img-wrap">
        <img src="1_생선가시_fishbone.svg" alt="생선가시">
      </div>
      <div class="card-title">생선 가시</div>
      <div class="card-desc">!쓰레기 소품</div>
      <span class="badge">16x16 Pixel SVG</span>
    </div>

    <div class="card">
      <div class="img-wrap">
        <img src="2_포션병_potion.svg" alt="포션병">
      </div>
      <div class="card-title">마법 물약병</div>
      <div class="card-desc">!비료 / 마법 소품</div>
      <span class="badge">16x16 Pixel SVG</span>
    </div>

    <div class="card">
      <div class="img-wrap">
        <img src="3_네잎클로버_clover.svg" alt="네잎클로버">
      </div>
      <div class="card-title">네잎클로버</div>
      <div class="card-desc">!물 / 자연 꽃 소품</div>
      <span class="badge">16x16 Pixel SVG</span>
    </div>

    <div class="card">
      <div class="img-wrap">
        <img src="4_커피종이컵_coffeecup.svg" alt="커피종이컵">
      </div>
      <div class="card-title">테이크아웃 컵</div>
      <div class="card-desc">!쓰레기 소품</div>
      <span class="badge">16x16 Pixel SVG</span>
    </div>
  </div>

  <div class="info-footer">
    💡 <span class="highlight">특징</span>: 벡터(SVG)라서 아무리 확대해도 도트 경계가 흐려지지 않으며, 파일 크기는 개당 단 1KB 미만입니다!
  </div>
</body>
</html>
