<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Bloom & Junkyard - OBS Overlay & Interactive Garden</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Mock Game Screen Background Container */
    #mock-game-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; transition: opacity 0.3s ease;
      background: #090d16;
    }
    #mock-game-screen.hidden { opacity: 0; display: none; }
    #mock-game-canvas { width: 100%; height: 100%; display: block; }

    /* Streamer Webcam Mockup (Top-Left) */
    #mock-webcam {
      position: absolute; top: 68px; left: 24px; width: 220px; height: 135px;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 2px solid #6366f1; border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #e0e7ff; z-index: 50; overflow: hidden;
    }
    .webcam-badge {
      position: absolute; top: 6px; left: 8px; font-size: 10px; font-weight: 800;
      background: #ef4444; color: #fff; padding: 2px 6px; border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .webcam-avatar {
      font-size: 44px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      animation: avatarFloat 2.5s ease-in-out infinite alternate;
    }
    @keyframes avatarFloat { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    .webcam-name { font-size: 11px; font-weight: 700; color: #a5b4fc; margin-top: 4px; }

    /* Mock In-Game Twitch Chat (Right-Middle, High z-index, Never Obscured) */
    #mock-chat {
      position: absolute; bottom: 230px; right: 24px; width: 260px; height: 210px;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 10px;
      padding: 10px; display: flex; flex-direction: column; justify-content: flex-end;
      overflow: hidden; z-index: 50; pointer-events: none;
    }
    .mock-chat-header {
      font-size: 11px; font-weight: 800; color: #a855f7; margin-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 4px;
    }
    .mock-chat-messages {
      display: flex; flex-direction: column; gap: 4px; font-size: 12px;
      overflow: hidden; max-height: 170px;
    }
    .chat-msg {
      display: flex; gap: 6px; align-items: baseline; word-break: break-all;
      animation: chatFadeIn 0.2s ease-out;
    }
    @keyframes chatFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .chat-user { font-weight: 700; font-size: 11px; }
    .chat-text { color: #f1f5f9; }

    /* Pixelated Garden & Junkyard Canvas */
    #garden-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: block; pointer-events: none; z-index: 10;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }

    /* Real Twitch Live Stream Player Iframe */
    #twitch-live-frame {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      border: none; z-index: 2; display: none; background: #000;
    }

    /* Top Floating Control Toolbar */
    #ui-container {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 1420px;
      background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px; padding: 10px 16px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; color: #f1f5f9; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 100; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #ui-container.hidden {
      opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-20px); display: none;
    }
    .ui-group { display: flex; align-items: center; gap: 6px; }
    .ui-title { font-weight: 800; font-size: 13px; color: #38bdf8; letter-spacing: 0.5px; margin-right: 4px; }
    input[type="text"] {
      background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px; color: #fff; padding: 5px 10px; font-size: 13px; outline: none; width: 130px;
    }
    input[type="text"]:focus { border-color: #38bdf8; }
    button {
      background: #1e293b; color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s ease;
    }
    button:hover { background: #334155; border-color: rgba(255, 255, 255, 0.35); }
    button.btn-primary { background: #0284c7; border-color: #38bdf8; }
    button.btn-primary:hover { background: #0369a1; }
    button.btn-water { background: #0284c7; border-color: #38bdf8; }
    button.btn-sun { background: #d97706; border-color: #fbbf24; }
    button.btn-trash { background: #c2410c; border-color: #fb923c; }
    button.btn-clean { background: #15803d; border-color: #4ade80; }
    button.btn-gold { background: #854d0e; border-color: #facc15; }
    button.btn-card { background: #6d28d9; border-color: #c084fc; }
    button.btn-mock { background: #334155; border-color: #94a3b8; }
    button.btn-mock.active { background: #4f46e5; border-color: #818cf8; color: #fff; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 20px; background: rgba(51, 65, 85, 0.6);
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.connecting { background: #eab308; box-shadow: 0 0 8px #eab308; }
    .status-dot.rejected, .status-dot.error { background: #ef4444; }
    .shortcut-hint { font-size: 11px; color: #94a3b8; margin-left: 4px; }
  </style>
</head>
<body>
  <!-- Real Twitch Live Stream Player (1080p full background) -->
  <iframe id="twitch-live-frame" src="" allowfullscreen></iframe>

  <!-- Mock Game Screen (Toggleable background for development/demo recording) -->
  <div id="mock-game-screen">
    <canvas id="mock-game-canvas"></canvas>
  </div>

  <!-- Streamer Webcam Mockup (Top-Left, z-index 50) -->
  <div id="mock-webcam">
    <div class="webcam-badge">🔴 LIVE 60FPS</div>
    <div class="webcam-avatar">🎮</div>
    <div class="webcam-name">STREAMER_CAM</div>
  </div>

  <!-- Mock In-Game Twitch Chat (Right-Middle, z-index 50) -->
  <div id="mock-chat">
    <div class="mock-chat-header">💬 LIVE TWITCH CHAT</div>
    <div id="mock-chat-list" class="mock-chat-messages">
      <div class="chat-msg"><span class="chat-user" style="color:#38bdf8;">system:</span> <span class="chat-text">Stream started! Welcome viewers!</span></div>
    </div>
  </div>

  <!-- Retro Pixel Art Garden Canvas (100% Transparent, Only Corners & Bottom Edges Populated) -->
  <canvas id="garden-canvas"></canvas>

  <!-- Floating Control UI -->
  <div id="ui-container">
    <!-- Twitch Connection Section -->
    <div class="ui-group">
      <span class="ui-title">🌿 TWITCH</span>
      <input type="text" id="channel-input" placeholder="Channel (e.g. shroud)" />
      <button id="btn-connect" class="btn-primary">Connect</button>
      <button id="btn-disconnect" style="display:none;">Disconnect</button>
      <div id="status-badge" class="status-badge">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Idle</span>
      </div>
    </div>

    <!-- Background Mock & Real Twitch Stream Toggle -->
    <div class="ui-group">
      <button id="btn-toggle-live" class="btn-primary" style="background:#7e22ce; border-color:#a855f7;">📺 Live Twitch Stream BG</button>
      <select id="preset-channels" style="background:#1e293b; color:#f8fafc; border:1px solid #a855f7; border-radius:6px; padding:5px 8px; font-size:12px; cursor:pointer;">
        <option value="">⚡ Quick Connect Live Stream</option>
        <option value="caedrel">🏆 Caedrel (LoL #1 Global)</option>
        <option value="xqc">🔥 xQc (Variety #1)</option>
        <option value="shroud">🎯 Shroud (FPS Legend)</option>
        <option value="riotgames">🎮 Riot Games (Official)</option>
      </select>
      <button id="btn-toggle-mock" class="btn-mock active">🎮 Mock Game Screen ON</button>
    </div>

    <!-- Interactive Test Buttons -->
    <div class="ui-group">
      <span class="ui-title">✨ TEST</span>
      <button id="btn-test-water" class="btn-water">💧 !water</button>
      <button id="btn-test-sun" class="btn-sun">☀️ !sun</button>
      <button id="btn-test-trash" class="btn-trash">🥫 !trash</button>
      <button id="btn-test-clean" class="btn-clean">🧹 !clean</button>
      <button id="btn-test-gold" class="btn-trash" style="background:#7e22ce; border-color:#c084fc;">🧪 !potion</button>
      <button id="btn-test-laugh">😂 lol</button>
    </div>

    <!-- Demo & Snapshot Card Controls -->
    <div class="ui-group">
      <button id="btn-auto-demo" class="btn-primary" style="background:#059669; border-color:#34d399;">🎬 Demo Simulator (100 Viewers)</button>
      <button id="btn-toggle-names">🏷️ Nameplates ON</button>
      <button id="btn-toggle-card" class="btn-card">🏆 Recap Card</button>
      <button id="btn-download-png" style="display:none;">💾 Save PNG</button>
    </div>

    <!-- Audio & OBS Controls -->
    <div class="ui-group">
      <button id="btn-mute">🔊 Sound ON</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.15" style="width: 60px;" />
      <button id="btn-hide-ui">Hide UI <span class="shortcut-hint">[H]</span></button>
    </div>
  </div>

  <script type="module">
    import { createGarden } from './src/garden.mjs';
    import { connectTwitch } from './src/twitch-irc.mjs';
    import { createRenderer } from './src/renderer.mjs';
    import { createSummaryCard } from './src/summary-card.mjs';
    import { createDemoSimulation } from './src/demo-sim.mjs';
    import * as audio from './src/audio.mjs';

    // Initialize Core Modules
    const garden = createGarden({ autoPlant: true });
    const canvas = document.getElementById('garden-canvas');
    const rendererApp = createRenderer({ canvas });

    // Set gentle, quiet initial volume (0.15)
    audio.setVolume(0.15);

    const summaryCard = createSummaryCard({
      onDownloadComplete: () => { console.log('Summary card PNG downloaded.'); }
    });
    rendererApp.scene.add(summaryCard.group);

    // --- Mock Game Screen Animation Loop (Dungeon / Cyberpunk FPS Room) ---
    const mockCanvas = document.getElementById('mock-game-canvas');
    const mockCtx = mockCanvas.getContext('2d');
    let mockActive = true;

    function resizeMock() {
      mockCanvas.width = window.innerWidth;
      mockCanvas.height = window.innerHeight;
    }
    resizeMock();
    window.addEventListener('resize', resizeMock);

    function drawMockGame(time) {
      if (!mockActive) {
        mockCtx.clearRect(0, 0, mockCanvas.width, mockCanvas.height);
        return;
      }
      const w = mockCanvas.width, h = mockCanvas.height;
      mockCtx.clearRect(0, 0, w, h);
      mockCtx.imageSmoothingEnabled = false;

      // 1. Dark Retro Dungeon Atmosphere (No purple grid!)
      const horizonY = h * 0.48;
      mockCtx.fillStyle = '#080a10';
      mockCtx.fillRect(0, 0, w, horizonY);
      mockCtx.fillStyle = '#0e111a';
      mockCtx.fillRect(0, horizonY, w, h - horizonY);

      // Stone Wall Brick Pattern
      mockCtx.fillStyle = 'rgba(255, 255, 255, 0.025)';
      const brickH = 26, brickW = 60;
      for (let y = 0; y < horizonY; y += brickH) {
        const offset = (Math.floor(y / brickH) % 2) * (brickW / 2);
        for (let x = -brickW; x < w + brickW; x += brickW) {
          mockCtx.fillRect(x + offset, y, brickW - 2, brickH - 2);
        }
      }

      // Dungeon Floor Perspective Tiles
      mockCtx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      mockCtx.lineWidth = 1;
      const stepSpeed = (time * 15) % 35;
      for (let y = horizonY + stepSpeed; y < h; y += 35) {
        mockCtx.beginPath();
        mockCtx.moveTo(0, y);
        mockCtx.lineTo(w, y);
        mockCtx.stroke();
      }
      for (let x = -w * 0.4; x <= w * 1.4; x += 110) {
        mockCtx.beginPath();
        mockCtx.moveTo(w / 2, horizonY);
        mockCtx.lineTo(x, h);
        mockCtx.stroke();
      }

      // 2. Central FPS Reticle / Crosshair (Green retro pixel dot)
      const cx = Math.round(w / 2), cy = Math.round(h / 2);
      mockCtx.fillStyle = '#22c55e';
      // Center dot
      mockCtx.fillRect(cx - 2, cy - 2, 4, 4);

      // Reticle Brackets [ + ]
      mockCtx.strokeStyle = 'rgba(34, 197, 94, 0.7)';
      mockCtx.lineWidth = 2;
      // Top / Bottom
      mockCtx.beginPath();
      mockCtx.moveTo(cx, cy - 24); mockCtx.lineTo(cx, cy - 8);
      mockCtx.moveTo(cx, cy + 8); mockCtx.lineTo(cx, cy + 24);
      // Left / Right
      mockCtx.moveTo(cx - 24, cy); mockCtx.lineTo(cx - 8, cy);
      mockCtx.moveTo(cx + 8, cy); mockCtx.lineTo(cx + 24, cy);
      mockCtx.stroke();

      // Outer targeting corner ticks
      mockCtx.strokeStyle = 'rgba(34, 197, 94, 0.35)';
      mockCtx.strokeRect(cx - 36, cy - 36, 72, 72);

      // Safe Zone Indicator
      mockCtx.fillStyle = 'rgba(34, 197, 94, 0.4)';
      mockCtx.font = 'bold 11px monospace';
      mockCtx.textAlign = 'center';
      mockCtx.fillText('RETICLE :: SAFE ZONE (NO OVERLAY)', cx, cy + 54);

      // 3. Top-Left Retro Hearts HP Bar (Below Webcam: y: 212)
      const hpX = 24, hpY = 212;
      mockCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      mockCtx.fillRect(hpX, hpY, 220, 36);
      mockCtx.strokeStyle = '#334155';
      mockCtx.lineWidth = 1;
      mockCtx.strokeRect(hpX + 0.5, hpY + 0.5, 219, 35);

      // 5 Pixel Hearts
      for (let i = 0; i < 5; i++) {
        const hx = hpX + 12 + i * 22, hy = hpY + 10;
        mockCtx.fillStyle = '#ef4444';
        mockCtx.fillRect(hx, hy + 2, 6, 8);
        mockCtx.fillRect(hx + 8, hy + 2, 6, 8);
        mockCtx.fillRect(hx + 2, hy, 10, 12);
        mockCtx.fillRect(hx + 4, hy + 12, 6, 2);
        mockCtx.fillRect(hx + 6, hy + 14, 2, 2);
      }
      mockCtx.fillStyle = '#f8fafc';
      mockCtx.font = 'bold 10px monospace';
      mockCtx.textAlign = 'right';
      mockCtx.fillText('HP 100/100', hpX + 210, hpY + 22);

      // 4. Top-Right Retro Minimap
      const mapW = 146, mapH = 96;
      const mapX = w - mapW - 24, mapY = 68;
      mockCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      mockCtx.fillRect(mapX, mapY, mapW, mapH);
      mockCtx.strokeStyle = '#0284c7';
      mockCtx.strokeRect(mapX + 0.5, mapY + 0.5, mapW - 1, mapH - 1);

      // Minimap Header
      mockCtx.fillStyle = '#38bdf8';
      mockCtx.font = 'bold 9px monospace';
      mockCtx.textAlign = 'left';
      mockCtx.fillText('MAP: B3F SANCTUARY', mapX + 8, mapY + 14);

      // Compass 'N'
      mockCtx.fillStyle = '#ef4444';
      mockCtx.textAlign = 'right';
      mockCtx.fillText('▲ N', mapX + mapW - 8, mapY + 14);

      // Dungeon Rooms outline
      mockCtx.fillStyle = 'rgba(56, 189, 248, 0.15)';
      mockCtx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
      mockCtx.fillRect(mapX + 18, mapY + 26, 34, 26);
      mockCtx.strokeRect(mapX + 18, mapY + 26, 34, 26);
      mockCtx.fillRect(mapX + 58, mapY + 34, 46, 38);
      mockCtx.strokeRect(mapX + 58, mapY + 34, 46, 38);
      mockCtx.fillRect(mapX + 110, mapY + 44, 24, 28);
      mockCtx.strokeRect(mapX + 110, mapY + 44, 24, 28);

      // Player Blinking Dot
      const blink = Math.sin(time * 6) > 0;
      mockCtx.fillStyle = blink ? '#facc15' : '#eab308';
      mockCtx.fillRect(mapX + 78, mapY + 52, 5, 5);

      // 5. In-Game HUD: Weapon & Ammo (Bottom Center)
      mockCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      mockCtx.fillRect(cx - 130, h - 52, 260, 24);
      mockCtx.strokeStyle = '#475569';
      mockCtx.strokeRect(cx - 130 + 0.5, h - 52 + 0.5, 259, 23);

      mockCtx.fillStyle = '#a5b4fc';
      mockCtx.font = 'bold 10px monospace';
      mockCtx.textAlign = 'left';
      mockCtx.fillText('WEAPON: PLASMA CASTER', cx - 120, h - 36);

      mockCtx.fillStyle = '#facc15';
      mockCtx.textAlign = 'right';
      mockCtx.fillText('AMMO 28 / 30', cx + 120, h - 36);
    }

    // --- Mock Chat Feed Helper ---
    const mockChatList = document.getElementById('mock-chat-list');
    function addMockChatMessage(user, text) {
      if (!mockChatList) return;
      const msg = document.createElement('div');
      msg.className = 'chat-msg';
      const userSpan = document.createElement('span');
      userSpan.className = 'chat-user';
      // Pick dynamic color from username
      let hash = 0;
      for (let i = 0; i < user.length; i++) hash = user.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      userSpan.style.color = `hsl(${hue}, 85%, 65%)`;
      userSpan.textContent = user + ':';

      const textSpan = document.createElement('span');
      textSpan.className = 'chat-text';
      textSpan.textContent = text;

      msg.appendChild(userSpan);
      msg.appendChild(textSpan);
      mockChatList.appendChild(msg);

      if (mockChatList.children.length > 7) {
        mockChatList.removeChild(mockChatList.children[0]);
      }
      mockChatList.scrollTop = mockChatList.scrollHeight;
    }

    // --- Command Normalizer (Translate Korean & English aliases) ---
    function normalizeCommandText(text) {
      if (!text) return '';
      const trimmed = text.trim();
      const lower = trimmed.toLowerCase();
      if (['!물', '!물주기', '!water'].includes(lower)) return '!water';
      if (['!햇빛', '!해', '!햇살', '!sun', '!bloom', '!개화'].includes(lower)) return '!sun';
      if (['!쓰레기', '!피자', '!캔', '!바나나', '!버섯', '!생선', '!가시', '!커피', '!종이컵', '!배터리', '!사과', '!clover', '!비료', '!골드', '!황금', '!gold', '!포션', '!물약', '!potion', '!trash', '!pizza', '!can', '!fish', '!coffee', '!battery', '!apple'].includes(lower)) return '!trash';
      if (['!청소', '!빗자루', '!clean'].includes(lower)) return '!clean';
      if (['!심기', '!씨앗', '!plant'].includes(lower)) return '!plant';
      return trimmed;
    }

    // --- Core Event Handler (Dispatches to Garden, Audio, and Renderer) ---
    function handleEvent(event, now = Date.now()) {
      audio.initAudio();
      const rawText = event.text || '';
      const mappedText = normalizeCommandText(rawText);
      const normalizedEvent = { ...event, text: mappedText };

      const res = garden.apply(normalizedEvent, now);
      if (event.user && rawText) {
        addMockChatMessage(event.user, rawText);
      }

      if (res.accepted) {
        if (res.command === 'trash') {
          audio.playTrash();
        } else if (res.command === 'clean') {
          if (res.cleanedCount > 0) {
            audio.playClean();
            rendererApp.triggerCleanEffect();
          }
        } else if (res.command === 'water') {
          audio.playWater();
          rendererApp.triggerWaterEffect();
        } else if (res.command === 'sun') {
          audio.playSun();
          rendererApp.triggerSunEffect();
        } else if (res.command === 'gold') {
          audio.playGold();
          rendererApp.triggerGoldEffect();
        } else if (res.command === 'laugh') {
          // Crowd control: emit audio and visual effect only when throttle window allows
          if (res.emitEffect) {
            audio.playLaugh();
            rendererApp.triggerLaughEffect();
          }
        }

        // Sync flowers and trash
        rendererApp.syncFlowers(garden.getFlowers());
        rendererApp.syncTrash(garden.getTrash());

        if (summaryCard.isVisible()) {
          summaryCard.show(garden.getStats());
        }
      }
      return res;
    }

    // --- Main Render Loop ---
    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Draw background mock game screen
      drawMockGame(now);

      // Update 3D Garden, Physics & Particles
      rendererApp.update(dt);
      if (summaryCard.isVisible()) {
        summaryCard.update(dt);
      }

      rendererApp.renderer.render(rendererApp.scene, rendererApp.camera);
    }
    requestAnimationFrame(animate);

    // --- Button Bindings & Simulation ---
    const btnToggleMock = document.getElementById('btn-toggle-mock');
    const btnToggleLive = document.getElementById('btn-toggle-live');
    const presetChannels = document.getElementById('preset-channels');
    const twitchFrame = document.getElementById('twitch-live-frame');
    const mockGameScreen = document.getElementById('mock-game-screen');
    const mockWebcam = document.getElementById('mock-webcam');
    const mockChat = document.getElementById('mock-chat');
    let livePlayerActive = false;

    function activateLiveTwitch(channel) {
      if (!channel) return;
      channel = channel.toLowerCase().trim();
      const parentHost = window.location.hostname || 'localhost';
      twitchFrame.src = `https://player.twitch.tv/?channel=${encodeURIComponent(channel)}&parent=${parentHost}&parent=localhost&parent=127.0.0.1&muted=false`;
      twitchFrame.style.display = 'block';
      livePlayerActive = true;

      // Hide mock elements to let the real stream shine
      mockActive = false;
      mockGameScreen.classList.add('hidden');
      if (mockWebcam) mockWebcam.style.display = 'none';
      if (mockChat) mockChat.style.display = 'none';
      btnToggleMock.classList.remove('active');
      btnToggleMock.textContent = '🎮 Mock Game Screen OFF';
      btnToggleLive.textContent = `📺 Live [${channel}] Playing`;
      btnToggleLive.style.background = '#059669';
      btnToggleLive.style.borderColor = '#34d399';

      // Auto-connect Twitch IRC chat for this live stream
      channelInput.value = channel;
      if (twitchDisconnect) { twitchDisconnect(); twitchDisconnect = null; }
      try {
        twitchDisconnect = connectTwitch({
          channel,
          onChat: (msg) => { handleEvent(msg); },
          onStatus: (st) => { setStatus(st); }
        });
      } catch (e) { console.error('Auto IRC error:', e); }
    }

    btnToggleLive.addEventListener('click', () => {
      const ch = channelInput.value.trim() || 'caedrel';
      activateLiveTwitch(ch);
    });

    presetChannels.addEventListener('change', (e) => {
      const ch = e.target.value;
      if (ch) activateLiveTwitch(ch);
    });

    btnToggleMock.addEventListener('click', () => {
      mockActive = !mockActive;
      if (mockActive) {
        twitchFrame.style.display = 'none';
        twitchFrame.src = '';
        livePlayerActive = false;
        btnToggleLive.textContent = '📺 Live Twitch Stream BG';
        btnToggleLive.style.background = '#7e22ce';
        btnToggleLive.style.borderColor = '#a855f7';
        mockGameScreen.classList.remove('hidden');
        if (mockWebcam) mockWebcam.style.display = 'flex';
        if (mockChat) mockChat.style.display = 'flex';
        btnToggleMock.classList.add('active');
        btnToggleMock.textContent = '🎮 Mock Game Screen ON';
      } else {
        mockGameScreen.classList.add('hidden');
        if (mockWebcam) mockWebcam.style.display = 'none';
        if (mockChat) mockChat.style.display = 'none';
        btnToggleMock.classList.remove('active');
        btnToggleMock.textContent = '👻 Transparent OBS Mode';
      }
    });

    let localIdx = 1;
    function getNextViewer() { return 'viewer_' + (localIdx++); }

    document.getElementById('btn-test-water').addEventListener('click', () => {
      handleEvent({ user: getNextViewer(), text: '!water' });
    });
    document.getElementById('btn-test-sun').addEventListener('click', () => {
      handleEvent({ user: getNextViewer(), text: '!sun' });
    });
    document.getElementById('btn-test-trash').addEventListener('click', () => {
      handleEvent({ user: getNextViewer(), text: '!trash' });
    });
    document.getElementById('btn-test-clean').addEventListener('click', () => {
      handleEvent({ user: getNextViewer(), text: '!clean' });
    });
    const btnTestGold = document.getElementById('btn-test-gold');
    if (btnTestGold) {
      btnTestGold.addEventListener('click', () => {
        handleEvent({ user: getNextViewer(), text: '!potion' });
      });
    }
    const btnTestPotion = document.getElementById('btn-test-potion');
    if (btnTestPotion) {
      btnTestPotion.addEventListener('click', () => {
        handleEvent({ user: getNextViewer(), text: '!potion' });
      });
    }
    document.getElementById('btn-test-laugh').addEventListener('click', () => {
      handleEvent({ user: getNextViewer(), text: 'lol' });
    });

    // Demo Simulation
    const btnAutoDemo = document.getElementById('btn-auto-demo');
    const demoSim = createDemoSimulation({
      handleEvent,
      summaryCard,
      getStats: () => garden.getStats(),
      onStep: ({ starting, finished, stopped }) => {
        if (starting) {
          btnAutoDemo.textContent = '⏹ Stop Demo';
          btnAutoDemo.style.background = '#e11d48';
          btnAutoDemo.style.borderColor = '#fb7185';
        } else if (finished || stopped) {
          btnAutoDemo.textContent = '🎬 Demo Simulator (100 Viewers)';
          btnAutoDemo.style.background = '#059669';
          btnAutoDemo.style.borderColor = '#34d399';
        }
      }
    });
    btnAutoDemo.addEventListener('click', () => {
      audio.initAudio();
      if (demoSim.isRunning()) demoSim.stop();
      else demoSim.start();
    });

    // Summary Card Controls
    const btnToggleCard = document.getElementById('btn-toggle-card');
    const btnDownloadPng = document.getElementById('btn-download-png');
    btnToggleCard.addEventListener('click', () => {
      audio.initAudio();
      if (summaryCard.isVisible()) {
        summaryCard.hide();
        btnToggleCard.textContent = '🏆 Recap Card';
        btnDownloadPng.style.display = 'none';
      } else {
        summaryCard.show(garden.getStats());
        audio.playCard();
        btnToggleCard.textContent = '✖ Close Card';
        btnDownloadPng.style.display = 'inline-flex';
      }
    });
    btnDownloadPng.addEventListener('click', () => {
      summaryCard.downloadPNG('twitch-bloom-summary.png');
    });

    // Nameplate Toggle
    const btnToggleNames = document.getElementById('btn-toggle-names');
    let namesVisible = true;
    btnToggleNames.addEventListener('click', () => {
      namesVisible = rendererApp.toggleNameplates();
      btnToggleNames.textContent = namesVisible ? '🏷️ Nameplates ON' : '🏷️ Nameplates OFF';
      btnToggleNames.style.color = namesVisible ? '#f8fafc' : '#94a3b8';
    });

    // Audio Controls
    const btnMute = document.getElementById('btn-mute');
    const volumeSlider = document.getElementById('volume-slider');
    btnMute.addEventListener('click', () => {
      audio.initAudio();
      const muted = !audio.getMuted();
      audio.setMuted(muted);
      btnMute.textContent = muted ? '🔇 Muted' : '🔊 Sound ON';
    });
    volumeSlider.addEventListener('input', (e) => {
      audio.initAudio();
      audio.setVolume(parseFloat(e.target.value));
    });

    // UI Toggle & Keyboard Shortcut (H)
    const uiContainer = document.getElementById('ui-container');
    const btnHideUi = document.getElementById('btn-hide-ui');
    function toggleUI() { uiContainer.classList.toggle('hidden'); }
    btnHideUi.addEventListener('click', toggleUI);
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'h' || e.key === 'H') && document.activeElement?.tagName !== 'INPUT') {
        toggleUI();
      }
    });

    // Twitch IRC Connection
    const channelInput = document.getElementById('channel-input');
    const btnConnect = document.getElementById('btn-connect');
    const btnDisconnect = document.getElementById('btn-disconnect');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    let twitchDisconnect = null;

    function setStatus(status) {
      statusDot.className = 'status-dot ' + status;
      if (status === 'connected') {
        statusText.textContent = 'Connected';
        btnConnect.style.display = 'none';
        btnDisconnect.style.display = 'inline-flex';
        channelInput.disabled = true;
      } else if (status === 'connecting') {
        statusText.textContent = 'Connecting...';
      } else if (status === 'rejected') {
        statusText.textContent = 'Rejected';
        btnConnect.style.display = 'inline-flex';
        btnDisconnect.style.display = 'none';
        channelInput.disabled = false;
      } else {
        statusText.textContent = 'Idle';
        btnConnect.style.display = 'inline-flex';
        btnDisconnect.style.display = 'none';
        channelInput.disabled = false;
      }
    }

    btnConnect.addEventListener('click', () => {
      const channel = channelInput.value.trim();
      if (!channel) { alert('Please enter a channel name.'); return; }
      try {
        if (twitchDisconnect) twitchDisconnect();
        twitchDisconnect = connectTwitch({
          channel,
          onChat: (msg) => { handleEvent(msg); },
          onStatus: (st) => { setStatus(st); }
        });
      } catch (err) { alert('Connection error: ' + err.message); }
    });

    btnDisconnect.addEventListener('click', () => {
      if (twitchDisconnect) { twitchDisconnect(); twitchDisconnect = null; }
      setStatus('disconnected');
    });

    // URL Parameters for OBS Overlay
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('obs') === '1' || urlParams.get('overlay') === '1') {
      uiContainer.classList.add('hidden');
      if (mockActive) btnToggleMock.click();
    }
    if (urlParams.get('mock') === '0') {
      if (mockActive) btnToggleMock.click();
    }
    if (urlParams.get('demo') === '1' || urlParams.get('autodemo') === '1') {
      setTimeout(() => { btnAutoDemo.click(); }, 600);
    }
    const defCh = urlParams.get('channel');
    if (defCh) {
      channelInput.value = defCh;
      btnConnect.click();
    }

    window.twitchBloom = { garden, handleEvent, summaryCard, rendererApp, audio, demoSim };
  </script>
</body>
</html>
